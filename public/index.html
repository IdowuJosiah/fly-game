<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Territory Paddle</title>
<style>
:root {
  --bg: #000;
  --fg: #fff;
  --muted: #8a8a8a;
  --line: #333;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  overflow: hidden; -webkit-user-select: none; user-select: none;
}
#stage { position: relative; width: 100%; height: 100%; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 16px; background: rgba(0, 0, 0, 0.8);
}
.overlay.hidden { display: none; }
.card { width: min(300px, 100%); max-height: 100%; overflow: auto; }
h1 { margin: 0 0 24px; font-size: 20px; font-weight: 700; text-transform: lowercase; }
.hint { margin: -16px 0 24px; color: var(--muted); font-size: 12px; }
.seg { display: flex; margin: 16px 0 8px; border: 1px solid var(--line); background: var(--bg); }
.seg label { flex: 1; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; text-align: center; padding: 8px 0; font-size: 13px; color: var(--muted); cursor: pointer; }
.seg input:checked + span { background: var(--fg); color: var(--bg); }
.seg input:focus-visible + span { outline: 2px solid var(--fg); outline-offset: 2px; }
button {
  font: inherit; width: 100%; border: 1px solid var(--fg); border-radius: 0; padding: 12px;
  background: var(--fg); color: var(--bg); font-size: 14px; cursor: pointer;
}
button + button { margin-top: 8px; }
button.ghost { background: var(--bg); color: var(--fg); border-color: var(--line); }
button:disabled { opacity: 0.5; }
button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.gap { height: 16px; }
.stats { margin: 0 0 24px; font-size: 13px; color: var(--muted); }
#resultTitle { font-size: 28px; }
.codebox { font-size: 40px; font-weight: 700; letter-spacing: 0.2em; margin: 0 0 24px; }
input[type="text"] {
  font: inherit; width: 100%; box-sizing: border-box; padding: 12px; border-radius: 0; margin: 0 0 8px;
  background: var(--bg); color: var(--fg); border: 1px solid var(--line); font-size: 16px;
  letter-spacing: 0.2em; text-align: center; text-transform: uppercase;
}
input[type="text"]:focus-visible { outline: none; border-color: var(--fg); }
.snd {
  position: absolute; top: 8px; right: 8px; z-index: 5; width: auto; padding: 6px 8px;
  background: transparent; border: 0; color: var(--muted); font-size: 12px;
}
.pausebtn { right: auto; left: 8px; }
.snd.hidden { display: none; }
.msg { min-height: 18px; margin: 8px 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" aria-label="Game board"></canvas>
  <button id="snd" class="snd" aria-pressed="true">sound on</button>
  <button id="pauseBtn" class="snd pausebtn hidden">pause</button>

  <div id="menu" class="overlay">
    <div class="card">
      <h1>territory paddle</h1>
      <p class="hint">drag or ↑ ↓ · own 85%</p>
      <button id="friend">Play online</button>
      <div class="seg" role="radiogroup" aria-label="Bot level">
        <label><input type="radio" name="lvl" value="easy"><span>easy</span></label>
        <label><input type="radio" name="lvl" value="medium" checked><span>medium</span></label>
        <label><input type="radio" name="lvl" value="hard"><span>hard</span></label>
      </div>
      <button id="start" class="ghost">Play bot</button>
    </div>
  </div>

  <div id="online" class="overlay hidden">
    <div class="card">
      <h1>online</h1>
      <button id="find">Random opponent</button>
      <button id="create" class="ghost">Create room</button>
      <div class="gap"></div>
      <input type="text" id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Room code" placeholder="code">
      <button id="join" class="ghost">Join</button>
      <p class="msg" id="onlineMsg" role="status"></p>
      <button id="onlineBack" class="ghost">Back</button>
    </div>
  </div>

  <div id="lobby" class="overlay hidden">
    <div class="card">
      <h1 id="lobbyTitle">room</h1>
      <div class="codebox" id="roomCode">----</div>
      <button id="copyCode">Copy</button>
      <button id="lobbyCancel" class="ghost">Cancel</button>
    </div>
  </div>

  <div id="pause" class="overlay hidden">
    <div class="card">
      <h1>paused</h1>
      <button id="resume">Resume</button>
      <button id="pauseMenu" class="ghost">Menu</button>
    </div>
  </div>

  <div id="result" class="overlay hidden">
    <div class="card">
      <h1 id="resultTitle">Result</h1>
      <p class="stats" id="resultStats"></p>
      <p class="msg" id="resultMsg" role="status"></p>
      <button id="again">Rematch</button>
      <button id="toMenu" class="ghost">Menu</button>
    </div>
  </div>
</div>

<script src="/sim.js"></script>
<script>
(function () {
  'use strict';
  var Sim = window.TPSim, COLS = Sim.COLS, ROWS = Sim.ROWS, CFG = Sim.CFG, PADW = Sim.PADW, N = Sim.N;
  var STEP = 1 / 60, SNAP_MS = 1000 / 30, SEND_EVERY = 33;
  var C = { ind: '#000', pink: '#fff', indBall: '#fff', pinkBall: '#000', tile: '#888', ink: '#000', fg: '#fff', grey: '#888' };
  var FONT = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';
  var $ = function (id) { return document.getElementById(id); };
  var canvas = $('c'), ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W = 0, H = 0, dpr = 1, cs = 10, ox = 0, oy = 0;
  var mode = 'menu';              // menu (demo behind the overlay) | local | online
  var sim = null, watch = false, level = 'medium', paused = false;
  var myTeam = 0, viewTeam = 0;
  var ui = { banner: null, fx: [], shake: 0, endAt: 0, demoRestart: 0, parts: [], trails: {}, padFlash: [0, 0], lastCount: 0, lastPhase: '' };
  var keys = { up: false, down: false };
  var net = null;                 // online session
  var view = null;                // rebuilt each frame from snapshots when online
  var localTarget = ROWS / 2, localPadY = ROWS / 2;

  /* ---------- layout ---------- */
  function resize() {
    var r = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);   // 3x screens look the same at 2x and cost half the pixels
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    var topH = 46, botH = 62;
    // leave a strip down each side so a thumb can rest there without covering the paddle
    var side = Math.max(28, Math.round(W * 0.08));
    cs = Math.max(8, Math.min((W - side * 2) / COLS, (H - topH - botH - 24) / ROWS));
    ox = (W - COLS * cs) / 2;
    oy = topH + (H - topH - botH - ROWS * cs) / 2;
  }
  window.addEventListener('resize', resize);

  /* ---------- screens ---------- */
  function show(id) { $(id).classList.remove('hidden'); }
  function hide(id) { $(id).classList.add('hidden'); }
  function hideAllOverlays() { ['menu', 'online', 'lobby', 'result', 'pause'].forEach(hide); }
  function seed() { return (Math.random() * 4294967296) >>> 0; }

  function startDemo() {
    sim = Sim.createSim(seed(), ['medium', 'medium']);
    ui.fx = []; ui.banner = null; mode = 'menu'; watch = true; ui.demoRestart = 0; viewTeam = 0;
  }
  function startLocal() {
    closeNet();
    watch = false; myTeam = 0; viewTeam = 0; setPaused(false);
    sim = Sim.createSim(seed(), [null, level]);
    ui.fx = []; ui.banner = null; ui.endAt = 0; ui.shake = 0; ui.parts = []; ui.trails = {}; ui.lastPhase = '';
    mode = 'local';
    hideAllOverlays();
    hello();
  }
  // only bot matches can pause; online the server keeps running
  function canPause() { return mode === 'local' && sim && !sim.over; }
  function setPaused(p) {
    paused = !!p && canPause();
    if (paused) show('pause'); else hide('pause');
    keys.up = keys.down = false;
  }
  function toMenu() {
    setPaused(false);
    closeNet();
    hideAllOverlays(); show('menu');
    startDemo();
    hello();
  }

  /* ---------- sound ---------- */
  // Everything is synthesised with Web Audio, so there are no files to load.
  var audio = { ctx: null, master: null, bed: null, on: true, lastHit: 0, noiseBuf: null };
  try { audio.on = localStorage.getItem('tp-sound') !== 'off'; } catch (e) {}
  function audioStart() {
    if (!audio.on) return;
    if (!audio.ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audio.ctx = new AC();
      audio.master = audio.ctx.createGain(); audio.master.gain.value = 0.7;
      audio.master.connect(audio.ctx.destination);
    }
    if (audio.ctx.state === 'suspended') audio.ctx.resume();
    if (!audio.bed) startBed();
  }
  function tone(f1, f2, dur, vol, type, delay) {
    if (!audio.on || !audio.ctx) return;
    var c = audio.ctx, t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function hiss(dur, vol, from, to) {
    if (!audio.on || !audio.ctx) return;
    var c = audio.ctx, t = c.currentTime;
    if (!audio.noiseBuf) {
      audio.noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
      var d = audio.noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    var n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    n.buffer = audio.noiseBuf; f.type = 'lowpass';
    f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(f); f.connect(g); g.connect(audio.master);
    n.start(t); n.stop(t + dur + 0.05);
  }
  function startBed() {
    // a quiet low hum that slowly breathes under the game
    var c = audio.ctx, f = c.createBiquadFilter(), g = c.createGain(), lfo = c.createOscillator(), depth = c.createGain();
    f.type = 'lowpass'; f.frequency.value = 520;
    g.gain.value = 0; g.gain.setTargetAtTime(0.03, c.currentTime, 2.5);
    [55, 82.5, 110.3, 164.6].forEach(function (hz, i) {
      var o = c.createOscillator(); o.type = i % 2 ? 'triangle' : 'sine'; o.frequency.value = hz;
      o.connect(f); o.start();
    });
    lfo.frequency.value = 0.07; depth.gain.value = 0.012;
    lfo.connect(depth); depth.connect(g.gain); lfo.start();
    f.connect(g); g.connect(audio.master);
    audio.bed = g;
  }
  function setSound(on, quiet) {
    audio.on = on;
    if (!quiet) {
      try { localStorage.setItem('tp-sound', on ? 'on' : 'off'); } catch (e) {}
      if (on) audioStart();
    }
    if (audio.master) audio.master.gain.setTargetAtTime(on ? 0.7 : 0, audio.ctx.currentTime, 0.05);
    $('snd').textContent = on ? 'sound on' : 'sound off';
    $('snd').setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  $('snd').addEventListener('click', function (e) { e.stopPropagation(); setSound(!audio.on); });
  setSound(audio.on, true);
  // browsers only allow sound after the player touches or presses something
  ['pointerdown', 'keydown'].forEach(function (t) { window.addEventListener(t, audioStart); });

  function sfx(e) {
    if (mode === 'menu') return;                    // the demo behind the menu stays quiet
    var mine = e.team === viewTeam, c = audio.ctx;
    if (e.type === 'hit') {
      if (!c || c.currentTime - audio.lastHit < 0.045) return;
      audio.lastHit = c.currentTime;
      tone(mine ? 1250 : 950, mine ? 820 : 640, 0.05, mine ? 0.05 : 0.025, 'triangle');
    } else if (e.type === 'save') {
      tone(mine ? 520 : 400, mine ? 500 : 390, 0.13, mine ? 0.14 : 0.07, 'sine');
      tone(mine ? 1040 : 800, null, 0.05, 0.03, 'triangle');
    } else if (e.type === 'miss') {
      tone(150, 48, 0.4, mine ? 0.24 : 0.12, 'sine');
      hiss(0.25, mine ? 0.09 : 0.05, 1400, 200);
    } else if (e.type === 'pickup') {
      tone(660, null, 0.07, 0.07, 'triangle'); tone(990, null, 0.1, 0.07, 'triangle', 0.07);
    } else if (e.type === 'portal') {
      hiss(0.3, 0.06, 300, 3000);
    } else if (e.type === 'banner') {
      tone(880, 870, 0.3, 0.035, 'sine');
    }
  }
  function phaseSounds(s) {
    if (mode === 'menu' || !s) return;
    if (s.phase === 'countdown') {
      var n = Math.ceil(s.cd);
      if (n !== ui.lastCount && n > 0) tone(440, null, 0.09, 0.07, 'triangle');
      ui.lastCount = n;
    } else if (ui.lastPhase === 'countdown') {
      tone(880, null, 0.16, 0.08, 'triangle');
    }
    ui.lastPhase = s.phase;
  }
  function endSound(title) {
    var notes = title === 'You win' ? [523, 659, 784] : (title === 'Draw' ? [440, 440] : (title === 'You lose' ? [392, 330, 262] : [523, 659]));
    notes.forEach(function (hz, i) { tone(hz, null, 0.22, 0.08, 'triangle', i * 0.12); });
  }

  /* ---------- input ---------- */
  function setTargetFromPointer(clientY) {
    var r = canvas.getBoundingClientRect();
    var y = Math.max(0, Math.min(ROWS, (clientY - r.top - oy) / cs));
    if (mode === 'local' && !paused) sim.pad[0].target = y;
    else if (mode === 'online') localTarget = y;
  }
  canvas.addEventListener('pointerdown', function (e) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    setTargetFromPointer(e.clientY);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'mouse' || e.buttons) setTargetFromPointer(e.clientY);
  });
  function isTyping(e) { return e.target && e.target.tagName === 'INPUT' && e.target.type === 'text'; }
  window.addEventListener('keydown', function (e) {
    if (isTyping(e)) return;
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') { keys.up = true; e.preventDefault(); }
    if (k === 'ArrowDown' || k === 's' || k === 'S') { keys.down = true; e.preventDefault(); }
    if ((k === 'Escape' || k === 'p' || k === 'P') && canPause()) { setPaused(!paused); e.preventDefault(); }
  });
  // pause a bot match if the player switches away from the tab
  document.addEventListener('visibilitychange', function () { if (document.hidden && canPause()) setPaused(true); });
  window.addEventListener('keyup', function (e) {
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.up = false;
    if (k === 'ArrowDown' || k === 's' || k === 'S') keys.down = false;
  });

  /* ---------- menu wiring ---------- */
  document.querySelectorAll('input[name="lvl"]').forEach(function (el) {
    el.addEventListener('change', function () { level = el.value; });
  });
  $('start').addEventListener('click', function () { startLocal(); });
  $('friend').addEventListener('click', function () { hide('menu'); $('onlineMsg').textContent = ''; show('online'); });
  $('onlineBack').addEventListener('click', function () { hide('online'); show('menu'); });
  $('find').addEventListener('click', function () { openNet({ t: 'find' }); });
  $('create').addEventListener('click', function () { openNet({ t: 'create' }); });
  $('join').addEventListener('click', joinFromInput);
  $('codeIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') joinFromInput(); });
  $('lobbyCancel').addEventListener('click', toMenu);
  $('copyCode').addEventListener('click', function () {
    var code = $('roomCode').textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(function () { $('copyCode').textContent = 'Copied'; });
  });
  $('toMenu').addEventListener('click', toMenu);
  $('pauseBtn').addEventListener('click', function (e) { e.stopPropagation(); setPaused(!paused); });
  $('resume').addEventListener('click', function () { setPaused(false); });
  $('pauseMenu').addEventListener('click', toMenu);
  $('again').addEventListener('click', function () {
    if (mode === 'online' && net) {
      send({ t: 'rematch' });
      $('again').disabled = true; $('again').textContent = 'Waiting';
    } else startLocal();
  });
  function joinFromInput() {
    var code = $('codeIn').value.trim().toUpperCase();
    if (code.length !== 4) { $('onlineMsg').textContent = 'Enter a code'; return; }
    openNet({ t: 'join', code: code });
  }

  /* ---------- networking ---------- */
  function send(obj) { if (net && net.ws && net.ws.readyState === 1) net.ws.send(JSON.stringify(obj)); }
  function closeNet() {
    if (!net) return;
    CFG.roundTime = 120;
    net.closing = true;
    try { send({ t: 'leave' }); net.ws.close(); } catch (e) {}
    clearTimeout(net.retryTimer);
    net = null; view = null;
    try { sessionStorage.removeItem('tp-session'); } catch (e) {}
  }
  function openNet(firstMsg) {
    closeNet();
    setTimeout(hello, 0);
    $('onlineMsg').textContent = 'Connecting';
    net = { ws: null, first: firstMsg, code: '', token: '', team: 0, snaps: [], over: false, closing: false, retries: 0, viewSrc: null, lastSend: 0, endMsg: null, joined: false };
    connect();
  }
  function connect() {
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    var ws = new WebSocket(proto + location.host + '/ws');
    net.ws = ws;
    ws.onopen = function () {
      net.retries = 0;
      if (net.joined) ws.send(JSON.stringify({ t: 'rejoin', code: net.code, token: net.token }));
      else ws.send(JSON.stringify(net.first));
    };
    ws.onmessage = function (e) { var m; try { m = JSON.parse(e.data); } catch (err) { return; } onNet(m); };
    ws.onclose = function () {
      if (!net || net.closing) return;
      if (!net.joined) { $('onlineMsg').textContent = 'Server unreachable'; net = null; return; }
      // still in the room screen (e.g. the creator went off to share the code): keep trying quietly
      if (mode !== 'online') { net.retryTimer = setTimeout(connect, 2000); return; }
      if (net.retries < 10) { net.retries++; ui.banner = { text: 'Reconnecting', team: -1, until: performance.now() + 1500 }; net.retryTimer = setTimeout(connect, net.retries === 1 ? 250 : 800); }
      else { ui.banner = { text: 'Connection lost', team: -1, until: performance.now() + 4000 }; showEnd({ lost: true }); }
    };
  }
  // Phones often drop the connection while the page is in the background. Coming back, reconnect
  // straight away instead of waiting for the old connection to time out.
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (!net || !net.joined || net.closing) return;
    if (net.ws.readyState !== 1 || Date.now() - hiddenAt > 2000) {
      clearTimeout(net.retryTimer);
      var old = net.ws; old.onclose = null; old.onmessage = null;
      try { old.close(); } catch (e) {}
      net.retries = 0; connect();
    }
  });
  function onNet(m) {
    var now = performance.now();
    if (m.t === 'room') {
      if (m.cfg && m.cfg.roundTime) CFG.roundTime = m.cfg.roundTime;
      net.joined = true; net.code = m.code; net.token = m.token; net.team = m.team; myTeam = m.team; viewTeam = m.team;
      net.pub = !!m.pub;
      if (m.players < 2 || m.wait) {
        var showCode = !m.pub && !m.wait;
        hide('online'); $('roomCode').textContent = m.code;
        $('lobbyTitle').textContent = m.wait ? 'waiting for host' : (m.pub ? 'searching' : 'room');
        $('copyCode').textContent = 'Copy';
        $('roomCode').style.display = $('copyCode').style.display = showCode ? '' : 'none';
        show('lobby');
      }
    } else if (m.t === 'snap') {
      if (mode !== 'online') { mode = 'online'; watch = false; hideAllOverlays(); localTarget = ROWS / 2; localPadY = ROWS / 2; view = newView(); }
      net.snaps.push({ rt: now, d: m });
      if (net.snaps.length > 12) net.snaps.shift();
      clockSample(now, m.sv);
      if (m.ev && m.ev.length) handleEvents(m.ev, now);
      if (m.wt) ui.banner = { text: 'Opponent reconnecting ' + m.wt, team: -1, until: now + 400 };
      else if (m.rs) ui.banner = { text: 'Resuming', team: -1, until: now + 400 };
    } else if (m.t === 'restart') {
      net.snaps = []; net.viewSrc = null; ui.parts = []; ui.trails = {}; ui.lastPhase = ''; net.over = false; net.endMsg = null; view = newView();
      hide('result'); ui.endAt = 0; ui.banner = null;
      $('again').disabled = false; $('again').textContent = 'Rematch'; $('resultMsg').textContent = '';
    } else if (m.t === 'end') {
      net.endMsg = m; net.over = true; ui.endAt = now + (m.forfeit >= 0 ? 0 : 900);
    } else if (m.t === 'opp') {
      var txt = { away: 'Opponent away', back: 'Opponent back', left: 'Opponent left', rematch: 'Rematch?' }[m.status];
      if (m.status === 'left') $('resultMsg').textContent = 'Opponent left';
      if (m.status === 'rematch') $('resultMsg').textContent = 'Opponent wants a rematch';
      if (txt) ui.banner = { text: txt, team: -1, until: now + 2500 };
    } else if (m.t === 'error') {
      if (m.fatal && net && net.pub && mode !== 'online') { openNet({ t: 'find' }); return; }   // search again
      if (m.fatal && net) { closeNet(); toMenu(); }
      $('onlineMsg').textContent = m.msg;
      if (net && !net.joined) { net.closing = true; try { net.ws.close(); } catch (e) {} net = null; }
    }
  }

  /* ---------- online view: interpolated from snapshots ---------- */
  function newView() {
    return {
      owner: new Uint8Array(N), fortUntil: new Float32Array(N), flipT: new Float32Array(N).fill(-9), init: false,
      t: 0, phase: 'countdown', cd: 3, suddenEnd: 0, tiles: [], waves: [], shots: [], portals: null,
      pad: [{ y: ROWS / 2 }, { y: ROWS / 2 }], balls: [], ghostUntil: [0, 0], turretUntil: [0, 0], share: [0.5, 0.5]
    };
  }
  function unpack(b64, fn) {
    var bin = atob(b64);

      ctx.fillStyle = C.fg;
      ctx.font = '700 ' + Math.max(16, Math.round(cs * 0.95)) + 'px ' + FONT;
      ctx.fillText((s.phase === 'sudden' ? 'Sudden death ' : '') + fmt(rem), ox + COLS * cs / 2, topY + topH / 2 + 1);
    }

    if (s.phase === 'countdown') {
      var n = Math.ceil(s.cd), frac = s.cd - Math.floor(s.cd);
      ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + 0.45 * frac).toFixed(2) + ')';
      ctx.font = '700 ' + Math.round(cs * 6) + 'px ' + FONT;
      ctx.textBaseline = 'middle';
      ctx.globalCompositeOperation = 'difference';      // stays readable across the black and white halves
      ctx.fillText(String(Math.max(1, n)), ox + COLS * cs / 2, oy + ROWS * cs / 2);
      ctx.globalCompositeOperation = 'source-over';
      if (online) {
        ctx.font = '700 ' + Math.round(cs * 0.8) + 'px ' + FONT;
        ctx.fillStyle = C.grey;
        ctx.fillText(myTeam === 0 ? 'you: black' : 'you: white', ox + COLS * cs / 2, oy + ROWS * cs / 2 + cs * 5);
      }
    }
  }

  /* ---------- main loop ---------- */
  var last = performance.now(), acc = 0;
  function frame(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    var s = sim;
    if (mode === 'online') {
      var dir = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
      if (dir) localTarget = Math.max(0, Math.min(ROWS, localTarget + dir * 28 * dt));
      s = buildView(now, dt) || sim;
      if (net && view && now - net.lastSend >= SEND_EVERY) {
        // also report where the paddle is drawn and what moment the screen shows, so the server
        // can judge catches the way the player saw them
        net.lastSend = now;
        send({ t: 'input', y: Math.round(localTarget * 100) / 100, py: Math.round(localPadY * 100) / 100, vt: Math.round(view.t * 1000) / 1000 });
      }
      if (net && net.over && ui.endAt && now >= ui.endAt) { ui.endAt = 0; showEnd({}); }
    } else if (sim && paused) {
      acc = 0;
    } else if (sim) {
      acc += dt;
      while (acc >= STEP) {
        if (mode === 'local') {
          var d2 = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
          if (d2) sim.pad[0].target = Math.max(0, Math.min(ROWS, sim.pad[0].target + d2 * 28 * STEP));
        }
        Sim.step(sim, STEP); acc -= STEP;
      }
      var ev = sim.events; sim.events = [];
      handleEvents(ev, now);
      if (sim.over) {
        if (mode === 'local' && ui.endAt && now >= ui.endAt) { ui.endAt = 0; showEnd({}); }
        if (mode === 'menu') {
          if (!ui.demoRestart) ui.demoRestart = now + 1500;
          else if (now >= ui.demoRestart) startDemo();
        }
      }
    }
    if (ui.shake > 0) ui.shake = Math.max(0, ui.shake - dt);
    phaseSounds(s);
    // in the room screen, tell the server we are still here (this stops when the page is in the background)
    if (net && net.joined && mode !== 'online' && !(now - (net.lastPing || 0) < 1000)) { net.lastPing = now; send({ t: 'ping' }); }
    var showPause = canPause() && !paused && !ui.endAt;
    if (showPause !== ui.pauseShown) { ui.pauseShown = showPause; $('pauseBtn').classList.toggle('hidden', !showPause); }
    if (debug) { var d0 = performance.now(); draw(now, s); debug.drawMs.push(performance.now() - d0); if (debug.drawMs.length > 600) debug.drawMs.shift(); }
    else draw(now, s);
    requestAnimationFrame(frame);
  }

  // Tell the server this page is open (for the private stats page): a random id per tab and what
  // it is doing, every 20 s while visible. Nothing else is sent.
  var pageId = Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 8);
  function hello() {
    if (document.hidden) return;
    var m = mode === 'online' || net ? 'online' : (mode === 'local' ? 'bot' : 'menu');
    try { fetch('/here?id=' + pageId + '&m=' + m, { method: 'POST', keepalive: true }).catch(function () {}); } catch (e) {}
  }
  hello(); setInterval(hello, 20000);
  document.addEventListener('visibilitychange', hello);

  // open the page with #debug to let tests read what is on screen and how long drawing takes
  var debug = location.hash === '#debug' ? (window.__tp = { drawMs: [], view: function () { return mode === 'online' ? view : sim; }, buffer: function () { var c = net && net.clock; if (!c) return null; var m = Infinity; c.s.forEach(function (q) { m = Math.min(m, q[1]); }); return c.off - m; } }) : null;

  resize();
  startDemo();
  requestAnimationFrame(frame);
})();
</script>
